# Oracle Database Config (FIAP)
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USER:seu_RM_fiap}
spring.datasource.password=${DB_PASSWORD:sua_senha_fiap}

# JPA/Hibernate (o Hibernate detecta o dialect do banco automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostrar SQL formatado no console
spring.jpa.properties.hibernate.format_sql=true