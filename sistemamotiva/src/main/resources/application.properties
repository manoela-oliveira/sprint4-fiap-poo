# Oracle Database Config (FIAP)
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USER:seu_RM_fiap}
spring.datasource.password=${DB_PASSWORD:sua_senha_fiap}

# JPA/Hibernate (o Hibernate detecta o dialect do banco automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostrar SQL formatado no console
spring.jpa.properties.hibernate.format_sql=true

# Ativa logs detalhados para requisições web e parsing de JSON
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=TRACE

# Jackson coloca 0.0 caso não encontre o double no JSON (evita erro 400)
spring.jackson.deserialization.fail-on-null-for-primitives=false